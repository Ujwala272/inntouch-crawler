name: Dump InnTouch Page HTML

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'Full URL of the page to dump'
        required: true
        type: string
      no_auth:
        description: 'Skip login entirely'
        required: false
        default: false
        type: boolean
      config_file:
        description: 'Config file (crawler/config/) to reuse auth/waitForSelector from, for non-InnTouch sites'
        required: false
        default: ''
        type: string

jobs:
  dump-page-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install crawler dependencies
        working-directory: ./crawler
        run: npm install

      - name: Install Playwright Chromium browser
        working-directory: ./crawler
        run: npx playwright install chromium --with-deps

      - name: Dump page HTML
        working-directory: ./crawler
        env:
          INNTOUCH_USERNAME: ${{ secrets.INNTOUCH_USERNAME }}
          INNTOUCH_PASSWORD: ${{ secrets.INNTOUCH_PASSWORD }}
          CHOICECENTRAL_USERNAME: ${{ secrets.CHOICECENTRAL_USERNAME }}
          CHOICECENTRAL_PASSWORD: ${{ secrets.CHOICECENTRAL_PASSWORD }}
          CONFIG_FILE: ${{ github.event.inputs.config_file }}
        run: |
          ARGS=("${{ github.event.inputs.page_url }}" --out output/page-dump.html)
          if [ "${{ github.event.inputs.no_auth }}" = "true" ]; then
            ARGS+=(--no-auth)
          fi
          if [ -n "$CONFIG_FILE" ]; then
            ARGS+=(--config "$CONFIG_FILE")
          fi
          node bin/dump-page-html.js "${ARGS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-dump-${{ github.run_number }}
          path: |
            crawler/output/page-dump.html
          retention-days: 30
